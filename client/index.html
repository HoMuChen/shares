<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>P2P File Share</title>
  </head>
  <body class="bg-gray-900 text-white min-h-screen flex items-center justify-center font-sans tracking-wide">
    <div id="app" class="w-full max-w-lg p-6">
      
      <!-- Landing View -->
      <div id="landing-view" class="space-y-8 text-center">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 animate-pulse">
          ⚡ Shares
        </h1>
        <p class="text-gray-400 text-lg">Instant P2P File Transfer</p>
        
        <div class="space-y-4">
          <button id="create-btn" class="w-full py-4 px-6 bg-blue-600 hover:bg-blue-700 rounded-xl font-bold text-lg shadow-lg hover:shadow-cyan-500/50 transition-all transform hover:-translate-y-1">
            Create Room
          </button>
          <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-gray-700"></div>
            <span class="flex-shrink-0 mx-4 text-gray-500">OR</span>
            <div class="flex-grow border-t border-gray-700"></div>
          </div>
          <div class="flex gap-2">
            <input id="join-input" type="text" placeholder="Enter Room ID" class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 text-center focus:outline-none focus:border-blue-500 transition-colors" />
            <button id="join-btn" class="px-6 bg-emerald-600 hover:bg-emerald-700 rounded-xl font-bold transition-all">
              Join
            </button>
          </div>
        </div>
      </div>

      <!-- Room View (Hidden initially) -->
      <div id="room-view" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <div class="flex flex-col">
            <h2 class="text-2xl font-bold">Room <span id="room-id-display" class="font-mono text-emerald-400">...</span></h2>
            <button id="leave-btn" class="text-xs text-red-500 hover:text-red-400 text-left underline mt-1">Leave Room</button>
          </div>
          <span id="status-badge" class="px-3 py-1 bg-yellow-500/20 text-yellow-500 text-xs rounded-full uppercase tracking-wider font-bold">Waiting</span>
        </div>

        <div id="share-info" class="bg-gray-800 p-4 rounded-2xl border border-gray-700 flex flex-col items-center gap-4">
          <p class="text-sm text-gray-400">Share this QR Code or Link</p>
          <canvas id="qrcode" class="rounded-lg shadow-lg"></canvas>
          <button id="copy-btn" class="text-xs text-blue-400 hover:text-blue-300">Copy Link</button>
        </div>

        <div class="space-y-4">
          <label for="file-input" class="group relative flex flex-col items-center justify-center w-full h-40 border-2 border-gray-700 border-dashed rounded-2xl cursor-pointer hover:border-blue-500 hover:bg-gray-800/50 transition-all">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <svg class="w-10 h-10 mb-3 text-gray-400 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
              <p class="mb-2 text-sm text-gray-400"><span class="font-semibold group-hover:text-white transition-colors">Click to upload</span> or drag and drop</p>
            </div>
            <input id="file-input" type="file" class="hidden" />
          </label>
        </div>

        <!-- Progress Area -->
        <div id="progress-area" class="hidden space-y-2">
            <div class="flex justify-between text-sm">
                <span id="transfer-status">Transferring...</span>
                <span id="transfer-percent">0%</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2.5">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
        </div>

        <!-- Downloads -->
        <div id="downloads-area" class="space-y-2"></div>
      </div>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
